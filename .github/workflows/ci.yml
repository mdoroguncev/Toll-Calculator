name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check Go code
        run: got vet ./...

      - name: Run tests with race detection
        run: go test -race ./...

      - name: Check protobuf definitions
        run: go run github.com/bufbuild/buf/cmd/buf@v1.75.0 lint
