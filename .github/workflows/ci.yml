name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check Go code
        run: go vet ./...

      - name: Run tests with race detection
        run: go test -race ./...

      - name: Check protobuf definitions
        run: go run github.com/bufbuild/buf/cmd/buf@v1.75.0 lint

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: toll_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.30.0

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 1
          done
          echo "PostgreSQL is ready"

      - name: Run migrations
        run: make migrate DB_DSN='postgres://postgres:postgres@localhost:5432/toll_test?sslmode=disable'

      - name: Run Postgres integration test
        env:
          TEST_DB_DSN: "postgres://postgres:postgres@localhost:5432/toll_test?sslmode=disable"
        run: go test ./internal/aggregator -run '^TestPostgresStore$' -count=1 -v
