services:
  # Kafka в режиме KRaft: один процесс работает и брокером, и контроллером (вместо Zookeeper)
  kafka:
    image: apache/kafka:4.1.0
    restart: unless-stopped
    ports:
      # Для Go-сервисов, запущенных на вашем компьютере (bootstrap.servers: localhost)
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Слушатели:
      # PLAINTEXT      kafka:29092    - для контейнеров внутри Docker-сети (kafka-ui)
      # PLAINTEXT_HOST localhost:9092 - для подключения с вашего ПК (Go-код)
      # CONTROLLER     :9093          - внутренний, для контроллера KRaft, наружу не пробрасывается
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Брокер один, поэтому служебные топики без реплик
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Топики (obuData) создаются автоматически при первой записи, с 3 партициями
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data

  # Веб-интерфейс для Kafka: топики, партиции, сообщения
  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    ports:
      - "9091:9090"
    # Go-сервисы работают на хосте, а не в Docker: так Prometheus достучится до них
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./.config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3030:3000"
    volumes:
      - ./.config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: toll
      POSTGRES_PASSWORD: toll
      POSTGRES_DB: toll
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toll -d toll"]
      interval: 5s
      timeout: 3s
      retries: 10
  
  aggregator:
    build:
      context: .
      args:
        SERVICE: aggregator
    environment:
      - AGG_STORE_TYPE=postgres
      - AGG_DB_DSN=postgres://toll:toll@postgres:5432/toll?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  receiver:
    build:
      context: .
      args:
        SERVICE: receiver
    environment:
      - KAFKA_BROKERS=kafka:29092

  calculator:
    build:
      context: .
      args:
        SERVICE: calculator
    environment:
      - KAFKA_BROKERS=kafka:29092
      - AGG_GRPC_URL=aggregator:3001

  gateway:
    build:
      context: .
      args:
        SERVICE: gateway
    environment:
      - AGG_GRPC_URL=aggregator:3001
    ports:
      - "6000:6000"

  obu:
    build:
      context: .
      args:
        SERVICE: obu
    environment:
      - OBU_WS_URL=ws://receiver:30000/ws

volumes:
  kafka-data:
  prometheus-data:
  grafana-data:
  postgres-data:
